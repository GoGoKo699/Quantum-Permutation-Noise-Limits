name: Inspect actual GitHub mathematics

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact public source for source-to-render comparison
        run: |
          mkdir -p hosted-math-audit/source
          git archive HEAD | tar -x -C hosted-math-audit/source
      - name: Install pinned browser and math compiler
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 mathjax-full@3.2.1
          npx playwright install --with-deps chromium
      - name: Compare every expression with the actual GitHub MathML
        run: node verification/hosted_math_audit.cjs
      - name: Save rendered HTML, observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-math-${{ github.sha }}
          path: hosted-math-audit/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
