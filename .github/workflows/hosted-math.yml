name: Inspect actual GitHub mathematics

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and math compiler
        run: |
          npm install --prefix /tmp/hosted-dependencies --no-save --no-package-lock playwright@1.56.1 mathjax-full@3.2.1
          /tmp/hosted-dependencies/node_modules/.bin/playwright install --with-deps chromium
      - name: Compare every expression with the actual GitHub MathML
        env:
          NODE_PATH: /tmp/hosted-dependencies/node_modules
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pages < <(git ls-tree -r --name-only HEAD | python -c 'import sys; print("\n".join(p for p in sys.stdin.read().splitlines() if p.endswith(".md") and p != "AGENTS.md"))')
          args=()
          for page in "${pages[@]}"; do args+=(--page "$page"); done
          node verification/hosted/capture_hosted_math.cjs --root . --repository GoGoKo699/Quantum-Permutation-Noise-Limits --revision "$(git rev-parse HEAD)" --output hosted-math-audit "${args[@]}"
      - name: Save rendered HTML, observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-math-${{ github.sha }}
          path: hosted-math-audit/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
