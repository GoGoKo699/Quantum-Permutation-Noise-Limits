name: Verify finite channel checks

on:
  push:
  pull_request:

jobs:
  finite-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install -r verification/requirements.txt
      - name: Check conditional loss and finite rates
        run: python verification/checks.py --max-spin 12
