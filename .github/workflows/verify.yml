name: Verify finite channel checks

on:
  push:
  pull_request:

jobs:
  finite-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install -r verification/requirements.txt
      - name: Check learning map and source links
        run: python verification/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned MathJax
        run: npm install --no-save --no-package-lock mathjax-full@3.2.1
      - name: Render and validate Markdown mathematics
        run: node verification/check_math_render.cjs
      - name: Check conditional loss and finite rates
        run: python verification/checks.py --max-spin 12
