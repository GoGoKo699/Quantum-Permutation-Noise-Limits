name: One-time reviewed Markdown repair

on:
  push:
    branches: [fix/hosted-math-integrity-20261029]

permissions:
  contents: write

jobs:
  apply-reviewed-repair:
    if: contains(github.event.head_commit.message, '[apply-render-protection]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply source-preserving formatting substitutions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '*.md'], text=True).splitlines()
          inline_count = display_count = macro_count = 0
          for name in paths:
              p = Path(name)
              before = p.read_text()
              chunks = re.split(r'(^```math[^\n]*\n[\s\S]*?^```[ \t]*$)', before, flags=re.M)
              def macros(tex):
                  global macro_count
                  macro_count += len(re.findall(r'\\operatorname\{(?:Tr|Sym)\}', tex))
                  return re.sub(r'\\operatorname\{(Tr|Sym)\}', lambda m: r'\mathrm{' + m[1] + '}', tex)
              for i, chunk in enumerate(chunks):
                  if chunk.startswith('```math'):
                      display_count += 1
                      chunks[i] = macros(chunk)
                  else:
                      def protect(match):
                          global inline_count
                          inline_count += 1
                          tex = macros(match[1]).replace(r'\|', r'\Vert ').replace('|', r'\vert ')
                          return '$`' + tex + '`$'
                      chunks[i] = re.sub(r'(?<![\\$])\$([^$\n]+?)(?<!\\)\$(?!\$)', protect, chunk)
              after = ''.join(chunks)
              assert r'\operatorname' not in after, name
              if after != before:
                  p.write_text(after)
          assert (inline_count, display_count, macro_count) == (402, 67, 17), (inline_count, display_count, macro_count)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert len(changed) == 13 and all(p.endswith('.md') for p in changed), changed
          print('Reviewed formatting only:', inline_count, 'inline expressions;', display_count, 'displays;', macro_count, 'blocked macros replaced.')
          PY
          python verification/check_docs.py
          git diff --stat
      - name: Save only the authorized repair branch without force
        env:
          REPAIR_BRANCH: fix/hosted-math-integrity-20261029
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/$REPAIR_BRANCH"
          test "$(git ls-remote origin "refs/heads/$REPAIR_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          git commit -m 'Protect all inline mathematics and replace GitHub-rejected operator macros'
          git push origin "HEAD:refs/heads/$REPAIR_BRANCH"
