name: One-time reviewed rendering refinement
on:
  push:
    branches: [fix/hosted-math-integrity-20261029]
permissions:
  contents: write
jobs:
  apply-reviewed-refinement:
    if: contains(github.event.head_commit.message, '[finalize-render-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact locally checked refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, subprocess
          for name in ['science/replacement_noise.md','science/classical_contrast.md']:
              p=Path(name); s=p.read_text()
              s=re.sub(r'^```math[^\n]*\n[\s\S]*?^```[ \t]*$',lambda m:m[0].replace('<',r'\lt '),s,flags=re.M)
              p.write_text(s)
          p=Path('verification/math_source.cjs');s=p.read_text()
          s=s.replace("    if(item.kind==='inline' && item.tex.includes('|'))", "    if(item.kind==='display' && item.tex.includes('<'))throw new Error('Raw less-than can be consumed by GitHub HTML processing: '+file+':'+item.line);\n    if(item.kind==='inline' && item.tex.includes('|'))")
          p.write_text(s)
          p=Path('verification/hosted_math_audit.cjs');s=p.read_text()
          s=s.replace("  return source.split('\\n').filter(l=>l.startsWith('|')", "  const prose=source.replace(/^```[^\\n]*\\n[\\s\\S]*?^```[ \\t]*$/gm,'');\n  return prose.split('\\n').filter(l=>l.startsWith('|')")
          p.write_text(s)
          p=Path('verification/check_docs.py');s=p.read_text().replace('import re\n','import re\nimport subprocess\n')
          s=s.replace('md_files = list(ROOT.rglob("*.md"))','md_files = [ROOT / name for name in subprocess.check_output(\n    ["git", "ls-files", "*.md"], cwd=ROOT, text=True\n).splitlines()]')
          p.write_text(s)
          p=Path('verification/check_math_render.cjs');s=p.read_text()
          s=s.replace("const path=require('node:path');", "const path=require('node:path');\nconst assert=require('node:assert/strict');")
          anchor="if(displays!==67||inline!==402)throw new Error('Incomplete source coverage');"
          addition="""
          // Negative regression checks for the three defects observed on the live host.
          const readme=fs.readFileSync(path.join(ROOT,'README.md'),'utf8');
          const raw=readme.replace('$`n`$','$n$');
          assert.notEqual(raw,readme);
          assert.throws(()=>checkSource('README.md',raw),/Unprotected inline/);
          const model=fs.readFileSync(path.join(ROOT,'science/model.md'),'utf8');
          const blocked=model.replace('\\\\mathrm{Tr}','\\\\operatorname{Tr}');
          assert.notEqual(blocked,model);
          assert.throws(()=>checkSource('science/model.md',blocked),/GitHub rejected operatorname/);
          const bridge=fs.readFileSync(path.join(ROOT,'learning/WATROUS_BRIDGE.md'),'utf8');
          const splitTable=bridge.replace('\\\\vert ','|');
          assert.notEqual(splitTable,bridge);
          assert.throws(()=>checkSource('learning/WATROUS_BRIDGE.md',splitTable),/Inline TeX bar/);
          """
          s=s.replace(anchor,anchor+'\n'+addition)
          s=s.replace('console.log(`PASS:',"const replacement=fs.readFileSync(path.join(ROOT,'science/replacement_noise.md'),'utf8');\nconst truncated=replacement.replace('\\\\lt q','<q');\nassert.notEqual(truncated,replacement);\nassert.throws(()=>checkSource('science/replacement_noise.md',truncated),/Raw less-than/);\nconsole.log(`PASS:")
          p.write_text(s)
          p=Path('verification/README.md');s=p.read_text()
          s+='''
          ## Mathematical presentation checks

          Run **python verification/check_docs.py** for the learning map, tracked-file links and display fences. Install the pinned JavaScript dependencies with **npm install --no-save --no-package-lock mathjax-full@3.2.1 playwright@1.56.1**, then run **node verification/check_math_render.cjs**. The source check requires all 67 display equations and 402 protected inline expressions, rejects the known GitHub-incompatible operator macro and literal inline bars, and includes negative regression cases.

          For actual hosted verification, install the browser with **npx playwright install chromium** and run **node verification/hosted_math_audit.cjs** from a committed checkout whose revision is accessible on GitHub. This read-only audit visits all 14 Markdown pages at that exact commit, checks both 1440-pixel and 760-pixel viewports, and compares the complete rendered MathML symbol and script structure with the source. It also checks native equation coverage, GitHub error banners, unrendered formulas, table-column loss and display overflow. Screenshots, hosted HTML and a JSON observation report are written under **hosted-math-audit/**; the GitHub workflow retains them as run artifacts for seven days.

          Spacing-only MathML wrappers and empty alignment cells are normalized for comparison; symbols, relations, subscripts, superscripts, fractions and meaningful structure are retained. A standalone TeX parser pass is not a substitute for this hosted check or for visual inspection of its screenshots. Rendering integrity is separate from scientific proof validity.
          '''
          p.write_text(s)
          expected={'science/replacement_noise.md':'399a0931693a9907c86340afffd85cb53b857431','science/classical_contrast.md':'5d5b7db5654147d496b291fa8e13075733ecce3b','verification/math_source.cjs':'7e84c35c33794895faa32894877a345a4d4dd4c8','verification/hosted_math_audit.cjs':'98ce0ff20401ee8e6f53a3fb8d9780a09c7e409f','verification/check_math_render.cjs':'b735fb44632c1fc18b051a9571f1d137fde49e54','verification/check_docs.py':'a832c5c37ed5a7d9651fff831516360e2a6fa2dd','verification/README.md':'c22fc3c441688e487cb0e92aaa5c20e1f680e27e'}
          for name, want in expected.items():
              b=Path(name).read_bytes();got=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
              assert got==want,(name,got,want)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==set(expected),changed
          print('All seven files match locally reviewed exact Git blob identities.')
          PY
          npm install --no-save --no-package-lock mathjax-full@3.2.1
          node verification/check_math_render.cjs
          python verification/check_docs.py
      - name: Fast-forward the authorized branch only
        env:
          REPAIR_BRANCH: fix/hosted-math-integrity-20261029
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/$REPAIR_BRANCH"
          test "$(git ls-remote origin "refs/heads/$REPAIR_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science/replacement_noise.md science/classical_contrast.md verification/math_source.cjs verification/hosted_math_audit.cjs verification/check_math_render.cjs verification/check_docs.py verification/README.md
          git commit -m 'Escape strict inequalities and add exact hosted-math regression checks'
          git push origin "HEAD:refs/heads/$REPAIR_BRANCH"
